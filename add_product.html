<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm - Quản Trị Cửa Hàng Điện Thoại</title>
    <link href="./src/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .fade-in.active {
            opacity: 1;
        }

        .flashing-text {
            animation: flash 2s linear infinite;
        }

        @keyframes flash {
            0% { color: #f44336; }
            20% { color: #e91e63; }
            40% { color: #9c27b0; }
            60% { color: #3f51b5; }
            80% { color: #2196f3; }
            100% { color: #f44336; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-primary text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flashing-text">Cửa Hàng Điện Thoại</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="hover:text-gray-200">Trang Chủ</a></li>
                    <li><a href="products.html" class="hover:text-gray-200">Sản Phẩm</a></li>
                    <li><a href="about.html" class="hover:text-gray-200">Giới Thiệu</a></li>
                    <li><a href="contact.html" class="hover:text-gray-200">Liên Hệ</a></li>
                    <li><a href="admin.html" class="hover:text-gray-200">Quản Trị</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-4">
        <section class="add-product">
            <h2 class="text-3xl font-semibold mb-4 text-gray-800">Thêm Sản Phẩm Mới</h2>
            <form class="bg-white rounded-lg shadow-md p-6">
                <div class="mb-4">
                    <label for="productName" class="block text-gray-700 text-sm font-bold mb-2">Tên Sản Phẩm:</label>
                    <input type="text" id="productName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="productDescription" class="block text-gray-700 text-sm font-bold mb-2">Mô Tả Sản Phẩm:</label>
                    <textarea id="productDescription" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
                </div>
                <div class="mb-4">
                    <label for="productPrice" class="block text-gray-700 text-sm font-bold mb-2">Giá Sản Phẩm:</label>
                    <input type="number" id="productPrice" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="productImage" class="block text-gray-700 text-sm font-bold mb-2">URL Hình Ảnh Sản Phẩm:</label>
                    <input type="url" id="productImage" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300" type="submit">
                    Thêm Sản Phẩm
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-gray-200 text-center p-4 mt-8">
        <p>&copy; 2024 Cửa Hàng Điện Thoại. All rights reserved.</p>
        <p>Bản quyền thuộc về Chiến Lê</p>
    </footer>
    <script src="./src/script.js"></script>
</body>
</html>
